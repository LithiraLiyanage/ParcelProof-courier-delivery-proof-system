version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: parcelproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parcelproof_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - parcelproof_data:/var/lib/postgresql/data
volumes:
  parcelproof_data:
